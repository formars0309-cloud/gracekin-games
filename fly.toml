# 운영 중인 커뮤니티 전용 앱의 도메인 전환 설정이다. 기존 경국지계 앱에는 적용하지 않는다.
app = "gracekin-games-community"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8766"
  DATA_DIR = "/data"
  # FLY_APP_NAME이 이 전용 앱과 일치할 때만 Fly Proxy의 접속자 IP를 신뢰한다.
  TRUST_FLY_PROXY = "true"
  # 정식 출처와 상태 확인 Host를 함께 전환한다. DNS·인증서 준비 후 조율자가 배포한다.
  BETTER_AUTH_URL = "https://community.gracekingames.com"
  # 옛 주소는 GET/HEAD 화면 요청만 정식 출처로 넘기며 API·쓰기 요청은 거부한다.
  LEGACY_HOSTS = "gracekin-games-community.fly.dev"

[http_service]
  internal_port = 8766
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    [http_service.checks.headers]
      Host = "community.gracekingames.com"

[mounts]
  source = "community_data"
  destination = "/data"
  scheduled_snapshots = true
  snapshot_retention = 5

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
