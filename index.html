<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracekin Games</title>
<meta name="description" content="Gracekin Games(그레이스킨 게임즈)의 게임을 브라우저에서 바로 플레이하세요. 슬라임 라인, 경국지계.">
<meta property="og:title" content="Gracekin Games">
<meta property="og:description" content="누르면 바로 시작하는 게임 모음 — 슬라임 라인, 경국지계">
<meta property="og:type" content="website">
<meta property="og:image" content="https://gracekingames.com/assets/slime-line.png">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --ink: #2b2622;
    --muted: #6f665e;
    --line: #e8e1d7;
    --accent: #b0894f;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(43, 38, 34, .06), 0 8px 24px rgba(43, 38, 34, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --surface: #211d17;
      --ink: #f1ebe2;
      --muted: #a89e92;
      --line: #342e26;
      --accent: #d2ae73;
      --accent-ink: #1b1711;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 "Noto Sans KR", system-ui, -apple-system, sans-serif;
  }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }

  header { padding-top: 56px; padding-bottom: 32px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 40px; height: 40px; flex: none; }
  .brand-name {
    font-family: "Gowun Batang", serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: .01em;
  }
  .tagline { margin: 20px 0 0; color: var(--muted); font-size: 17px; }

  h2 {
    font-family: "Gowun Batang", serif;
    font-size: 20px;
    margin: 16px 0 16px;
  }
  .games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 0;
    margin: 0;
    list-style: none;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .card-art { aspect-ratio: 16 / 10; overflow: hidden; }
  .card-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slime .card-art { background: linear-gradient(160deg, #fbeee9, #ece3f7); }
  .slime .card-art img { object-position: center 70%; }
  .gyeongguk .card-art { background: #141210; }
  .gyeongguk .card-art img { object-fit: contain; padding: 18px; }
  .card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; }
  .card h3 { margin: 0; font-size: 20px; }
  .genre { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .desc { margin: 12px 0 18px; flex: 1; }
  .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .play {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 22px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    text-decoration: none;
  }
  .play:hover { filter: brightness(1.06); }
  .play:focus-visible, .small:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .small { font-size: 13px; color: var(--muted); }

  footer.wrap {
    margin-top: 64px;
    padding-top: 28px;
    padding-bottom: 48px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
  }
  footer p { margin: 4px 0; }
</style>
</head>
<body>
  <header class="wrap">
    <div class="brand">
      <!-- 나란히 선 두 원: 남매 -->
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="15" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <circle cx="25" cy="20" r="10" fill="none" stroke="var(--accent)" stroke-width="2.4"/>
      </svg>
      <span class="brand-name">Gracekin Games</span>
    </div>
    <p class="tagline">설치 없이, 누르면 바로 시작하는 게임들.</p>
  </header>

  <main class="wrap">
    <h2>게임</h2>
    <ul class="games">
      <li class="card slime">
        <div class="card-art"><img src="assets/slime-line.png" alt="분홍 슬라임" width="384" height="384"></div>
        <div class="card-body">
          <h3>슬라임 라인</h3>
          <p class="genre">선 그리기 퍼즐 · 모두</p>
          <p class="desc">선을 그려 슬라임의 길을 만들어요. 사계절 모험, 우리 마을과 봄 산책 섬을 만나세요.</p>
          <div class="actions">
            <a class="play" data-game="slime" href="https://slimeline.gracekingames.com/">바로 플레이</a>
            <a class="small" data-privacy="slime" href="https://slimeline.gracekingames.com/privacy.html">개인정보처리방침</a>
          </div>
        </div>
      </li>
      <li class="card gyeongguk">
        <div class="card-art"><img src="assets/gyeongguk.png" alt="경국지계 로고, 금빛 원 안의 傾" width="384" height="384"></div>
        <div class="card-body">
          <h3>경국지계</h3>
          <p class="genre">카드 대전 TCG</p>
          <p class="desc">덮어 둔 카드 한 장이 판을 뒤집는다. 미인과 계략의 삼국 카드 대전.</p>
          <div class="actions">
            <a class="play" data-game="gyeongguk" href="https://gyeongguk.gracekingames.com/">바로 플레이</a>
            <a class="small" data-privacy="gyeongguk" href="https://gyeongguk.gracekingames.com/privacy">개인정보처리방침</a>
          </div>
        </div>
      </li>
    </ul>
  </main>

  <footer class="wrap">
    <p>© 2026 Gracekin Games (그레이스킨 게임즈)</p>
    <!-- 사업자등록·통신판매업 신고가 끝나면 상호·대표자·사업자등록번호·통신판매업 신고번호·연락처를 여기에 넣는다 -->
  </footer>
</body>
</html>
